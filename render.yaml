# Render Blueprint — Backend Web Service
# Root Directory: backend/
services:
  - type: web
    name: bsc-exclusive-tracking-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: FILE_STORAGE_TYPE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: evidence
      - key: AUTO_APPROVE_HOURS
        value: "1"
      - key: MAX_FILE_SIZE_MB
        value: "25"
