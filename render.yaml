# Render Blueprint — deploy the backend as a Web Service.
# Connect this repository's root to Render, or set "Root Directory" to backend/
# and use backend/render.yaml instead.
services:
  - type: web
    name: bsc-exclusive-tracking-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        sync: false            # paste your Supabase Direct connection string in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true    # Render generates a strong secret for you
      - key: CORS_ORIGIN
        sync: false            # your deployed frontend URL, e.g. https://my-app.vercel.app
      - key: FILE_STORAGE_TYPE
        value: supabase
      - key: SUPABASE_URL
        sync: false            # https://xxxx.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # service_role key from Supabase (Settings → API)
      - key: SUPABASE_BUCKET
        value: evidence
      - key: AUTO_APPROVE_HOURS
        value: "1"
      - key: MAX_FILE_SIZE_MB
        value: "25"
